<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAGGU UI Live Preview</title>
  <link rel="stylesheet" href="./webview.css">
  <style>
    :root {
      --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --vscode-sideBar-background: #18181b;
      --vscode-sideBar-foreground: #e4e4e7;
      --vscode-foreground: #e4e4e7;
      --vscode-descriptionForeground: #a1a1aa;
      --vscode-input-background: #222226;
      --vscode-input-border: rgba(255, 255, 255, 0.12);
      --vscode-input-foreground: #ffffff;
      --vscode-button-background: #0078d4;
      --vscode-button-foreground: #ffffff;
      --vscode-editorWidget-background: rgba(255, 255, 255, 0.04);
      --vscode-widget-border: rgba(255, 255, 255, 0.08);
      --vscode-sideBarSectionHeader-background: rgba(0, 0, 0, 0.2);
      --vscode-sideBarSectionHeader-border: rgba(255, 255, 255, 0.08);
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #0d0d11;
      height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--vscode-font-family);
    }
    .preview-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .preview-header {
      color: #94a3b8;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .preview-container {
      width: 400px;
      height: 740px;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div class="preview-wrapper">
    <div class="preview-header">
      <span style="font-weight: 600; color: #f8fafc;">JAGGU Autonomous AI Coding Agent</span>
      <span>•</span>
      <span>VS Code Sidebar Live Webview</span>
    </div>
    <div class="preview-container">
      <div id="root" style="height: 100%; width: 100%;"></div>
    </div>
  </div>

  <script>
    // Mock acquireVsCodeApi for standalone browser preview
    window.acquireVsCodeApi = () => ({
      postMessage: (msg) => {
        console.log('[Mock VS Code RPC] Message sent:', msg);
        if (msg.type === 'ui.ready') {
          window.postMessage({
            type: 'agent.config',
            payload: {
              provider: 'openai',
              model: 'gpt-4o',
              models: [
                { id: 'auto', name: 'Auto (Recommended)', provider: 'openai', costTier: 'free', maxContextTokens: 128000, description: 'Smart automatic router' },
                { id: 'gpt-4o', name: 'GPT-4o', provider: 'openai', costTier: 'paid', maxContextTokens: 128000, description: 'High intelligence coding model' },
                { id: 'claude-3-5-sonnet', name: 'Claude 3.5 Sonnet', provider: 'anthropic', costTier: 'paid', maxContextTokens: 200000, description: 'State of the art coding model' }
              ]
            }
          }, '*');
        } else if (msg.type === 'user.submit') {
          // 1. Live processing status
          window.postMessage({
            type: 'agent.status',
            payload: { state: 'PROCESSING', detail: 'Analyzing workspace symbols & test suites...' }
          }, '*');

          // 2. Simulated response with code blocks, copy button, and plan
          setTimeout(() => {
            window.postMessage({
              type: 'agent.status',
              payload: { state: 'IDLE', detail: 'Ready' }
            }, '*');

            window.postMessage({
              type: 'agent.message',
              payload: {
                id: 'asst_' + Date.now(),
                role: 'assistant',
                text: 'I have analyzed the workspace. Here is the verified implementation plan and sample code:\\n\\n```typescript\\nimport { ModelGateway, ToolExecutor } from \"@jaggu/core\";\\n\\n// Initialize autonomous coding agent\\nconst gateway = new ModelGateway();\\nconst executor = new ToolExecutor();\\nconsole.log(\"JAGGU Ready: Zero silent writes enforced\");\\n```\\n\\nAll 250 tests passed across all packages. You can review the proposed changes below.',
                timestamp: Date.now()
              }
            }, '*');

            // 3. Simulated review proposal
            setTimeout(() => {
              window.postMessage({
                type: 'agent.approval_requested',
                payload: {
                  proposalId: 'prop_001',
                  filePath: 'packages/jaggu-core/src/index.ts',
                  diffSummary: '+12 lines: Registered new production router & verified safety guards'
                }
              }, '*');
            }, 600);
          }, 800);
        }
      },
      getState: () => ({}),
      setState: () => {}
    });
  </script>
  <script src="./webview.js"></script>
</body>
</html>
