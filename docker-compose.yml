version: '3.8'

services:
  jaggu-server:
    build:
      context: .
      dockerfile: packages/jaggu-server/Dockerfile
    container_name: jaggu-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - packages/jaggu-server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
